version: '3.8'

services:

  # =====================================================
  # KAFKA
  # =====================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-local

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-local:9093

      KAFKA_LISTENERS: PLAINTEXT://kafka-local:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka-local:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-local:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1


  # =====================================================
  # KAFKA UI
  # =====================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-local

    ports:
      - "8282:8080"

    depends_on:
      - kafka

    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-local:29092


  # =====================================================
  # POSTGRESQL
  # =====================================================
  postgres:
    image: postgres:16
    container_name: postgres-local

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  # =====================================================
  # MONGODB
  # =====================================================
  mongodb:
    image: mongo:7
    container_name: mongodb-local

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_DATABASE: order_nosql

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped


# =====================================================
# VOLUMES
# =====================================================
volumes:
  postgres_data:
  mongodb_data: